<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Open Tech Inc. — One Repository for Business Ideation &amp; Technology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2ecdf;          /* cream paper */
    --ink:#141414;         /* brutal black */
    --paper:#fffdf7;
    --acc:#FFD02F;         /* phase 01 acid yellow */
  }
  *{ box-sizing:border-box; }
  html,body{
    width:100%; height:100%; max-width:100vw; max-height:100vh;
    margin:0; padding:0; overflow:hidden; overflow-x:hidden;
    position:fixed; inset:0; touch-action:none; -webkit-text-size-adjust:100%;
  }
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:#141414; color:#f2ecdf; }
  button{ font-family:inherit; }
  button:focus-visible{ outline:3px solid #141414; outline-offset:2px; }

  #scene{ position:fixed; inset:0; width:100%; height:100%; max-width:100vw; max-height:100vh; display:block; cursor:grab; touch-action:none; }
  #scene:active{ cursor:grabbing; }

  /* legibility scrim (cream) */
  #scrim{
    position:fixed; inset:0; pointer-events:none; z-index:1;
    background:linear-gradient(90deg, rgba(242,236,223,.92) 0%, rgba(242,236,223,.55) 38%, rgba(242,236,223,0) 62%);
    transition:opacity .8s;
  }
  body.ov #scrim{ opacity:.2; }

  /* corner + marks — brutalist drafting detail */
  .cnr{
    position:fixed; z-index:3; pointer-events:none;
    font-weight:700; font-size:20px; color:#141414; line-height:1;
  }

  /* wordmark = sticker chip */
  #mark{ position:fixed; top:30px; left:44px; z-index:3; pointer-events:none; }
  .chip{
    display:inline-block; background:var(--acc); color:#141414;
    border:3px solid #141414; box-shadow:5px 5px 0 #141414;
    padding:8px 18px; font-weight:700; font-size:16px; letter-spacing:.22em; text-indent:.22em;
    transition:background-color .5s;
  }
  #mark .tag{
    display:inline-block; margin:14px 0 0 5px; background:#141414; color:#f2ecdf;
    font-family:'IBM Plex Mono',monospace; font-size:8.5px; letter-spacing:.24em;
    padding:5px 10px;
  }

  #ovBtn{
    position:fixed; top:30px; right:44px; z-index:3; cursor:pointer;
    font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600; letter-spacing:.22em;
    color:#141414; background:var(--paper); border:3px solid #141414;
    box-shadow:5px 5px 0 #141414; padding:12px 20px;
    transition:transform .12s, box-shadow .12s, background-color .3s;
  }
  #ovBtn:hover{ transform:translate(-2px,-2px); box-shadow:7px 7px 0 #141414; }
  #ovBtn:active{ transform:translate(3px,3px); box-shadow:1px 1px 0 #141414; }
  body.ov #ovBtn{ background:var(--acc); }

  /* phase rail — chunky cards */
  #rail{
    position:fixed; right:44px; top:50%; transform:translateY(-50%);
    z-index:3; display:flex; flex-direction:column; gap:12px; align-items:flex-end;
  }
  .rail-item{
    position:relative;
    overflow:hidden;
    display:flex; align-items:center; gap:9px; cursor:pointer;
    background:var(--paper); border:2.5px solid #141414; box-shadow:3px 3px 0 #141414;
    padding:6px 14px 6px 16px; color:#141414; opacity:.6;
    font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600; letter-spacing:.16em;
    transition:transform .15s cubic-bezier(.2,0,.2,1), box-shadow .15s, background-color .25s, opacity .25s, color .2s;
  }
  .rail-item::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:5px;
    background:var(--item-acc, #141414);
    transition:width .2s ease;
  }
  .rail-item .sq{
    width:9px; height:9px; background:#141414; flex:none;
    transition:transform .2s ease, background-color .2s ease;
  }
  .rail-item:hover{
    opacity:1;
    background:var(--item-acc, var(--acc));
    transform:translate(-3px,-3px);
    box-shadow:5px 5px 0 #141414, 8px 8px 0 var(--item-acc, var(--acc));
    color:#141414;
  }
  .rail-item:hover .sq{
    background:#141414;
    transform:rotate(45deg) scale(1.2);
  }
  .rail-item:hover::before{
    width:7px;
    background:repeating-linear-gradient(-45deg, #141414 0 6px, var(--item-acc, var(--acc)) 6px 12px);
    animation:tape 0.8s linear infinite;
  }
  .rail-item.active{
    opacity:1; background:var(--item-acc, var(--acc));
    transform:translate(-3px,-3px);
    box-shadow:5px 5px 0 #141414, 8px 8px 0 #141414;
  }
  .rail-item.active .sq{ background:#141414; transform:rotate(45deg); }
  .rail-item.active::before{
    width:7px;
    background:repeating-linear-gradient(-45deg, #141414 0 6px, #fffdf7 6px 12px);
    animation:tape 1.1s linear infinite;
  }

  /* specimen panel — brutal card */
  #panel{
    position:fixed; left:48px; bottom:112px; z-index:3; width:min(480px,46vw);
    max-width:calc(100vw - 96px);
    background:var(--paper); border:3px solid #141414; box-shadow:9px 9px 0 #141414;
    padding:26px 28px 12px;
    pointer-events:none;
    opacity:0; transform:translateY(14px);
    transition:opacity .5s ease, transform .5s ease;
    box-sizing:border-box; overflow:visible;
  }
  body.ready #panel{ opacity:1; transform:none; }
  body.ov #panel{ opacity:0; transform:translateY(14px); }
  #panel.swap .p-in{ opacity:0; transform:translateY(9px); }
  .p-in{ width:100%; max-width:100%; transition:opacity .24s ease, transform .24s ease; }

  #ghost{
    position:absolute; top:-138px; left:-6px; z-index:-1;
    font-weight:700; font-size:190px; line-height:1; letter-spacing:-.03em;
    color:var(--acc); -webkit-text-stroke:2.5px #141414;
    text-shadow:9px 9px 0 #141414;
    transform:rotate(-3deg);
    pointer-events:none; user-select:none;
    transition:color .5s;
  }
  .p-kicker{ display:flex; align-items:center; gap:14px; max-width:100%; }
  #pChip{
    display:grid; place-items:center; width:46px; height:46px; flex:none;
    background:var(--acc); border:3px solid #141414; box-shadow:4px 4px 0 #141414;
    font-weight:700; font-size:18px; transition:background-color .5s;
  }
  #pKicker{
    font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600; letter-spacing:.22em;
    color:#141414; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #pName{
    margin:16px 0 12px; font-weight:700; text-transform:uppercase;
    font-size:clamp(30px, 3.4vw, 42px); line-height:1; letter-spacing:-.02em;
    border-bottom:6px solid var(--acc); display:inline-block; padding-bottom:4px;
    max-width:100%; overflow-wrap:break-word; word-break:break-word;
    transition:border-color .5s;
  }
  #pBody{
    margin:0 0 16px; max-width:44ch; font-weight:500; font-size:14.5px;
    line-height:1.62; color:#33302a;
    overflow-wrap:break-word; word-break:break-word;
  }
  .p-row{
    display:grid; grid-template-columns:84px 1fr; gap:12px; align-items:baseline;
    border-top:2px solid #141414; padding:8px 0; max-width:100%;
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em;
  }
  .p-row .lbl{ font-weight:600; letter-spacing:.2em; }
  .p-row .val{ color:#55504a; line-height:1.7; overflow-wrap:break-word; word-break:break-word; }

  /* nav */
  #nav{ position:fixed; right:44px; bottom:60px; z-index:3; text-align:right; }
  #nav .btns{ display:flex; gap:12px; justify-content:flex-end; }
  .nbtn{
    width:48px; height:48px; display:grid; place-items:center; cursor:pointer;
    background:var(--paper); border:3px solid #141414; box-shadow:4px 4px 0 #141414; color:#141414;
    transition:transform .12s, box-shadow .12s, background-color .2s;
  }
  .nbtn:hover{ background:var(--acc); transform:translate(-2px,-2px); box-shadow:6px 6px 0 #141414; }
  .nbtn:active{ transform:translate(3px,3px); box-shadow:0 0 0 #141414; }
  .nbtn svg{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2.4; }
  #hint{
    margin-top:14px; font-family:'IBM Plex Mono',monospace; font-size:9px; font-weight:600;
    letter-spacing:.18em; color:#141414;
  }
  #hint b{
    background:var(--acc); border:1.5px solid #141414; padding:1px 6px; font-weight:600;
    transition:background-color .5s;
  }

  /* toast */
  #toast{
    position:fixed; bottom:122px; left:50%; transform:translate(-50%, 8px); z-index:4;
    font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600; letter-spacing:.14em;
    color:var(--acc); background:#141414; border:2px solid #141414;
    box-shadow:4px 4px 0 var(--acc);
    padding:10px 18px; opacity:0; pointer-events:none;
    max-width:min(500px, calc(100vw - 28px)); text-align:center;
    white-space:normal; word-break:break-word; overflow-wrap:break-word;
    box-sizing:border-box;
    transition:opacity .35s, transform .35s, box-shadow .5s;
  }
  #toast.show{ opacity:1; transform:translate(-50%,0); }

  /* hazard-tape progress + ticker */
  #prog{
    position:fixed; left:0; right:0; bottom:36px; height:12px; z-index:3;
    width:100%; max-width:100vw; overflow:hidden; box-sizing:border-box;
    background:#141414;
  }
  #progFill{
    height:100%; width:14.28%;
    background:repeating-linear-gradient(-45deg, var(--acc) 0 14px, #141414 14px 28px);
    border-right:3px solid var(--paper);
    animation:tape 1.1s linear infinite;
    transition:width .8s cubic-bezier(.7,0,.2,1);
  }
  @keyframes tape{ to{ background-position:40px 0; } }

  #ticker{
    position:fixed; left:0; right:0; bottom:0; height:36px; z-index:3;
    width:100%; max-width:100vw; overflow:hidden; contain:paint; box-sizing:border-box;
    background:#141414; color:#f2ecdf;
    display:flex; align-items:center;
  }
  #tickerInner{
    display:flex; width:max-content; align-items:center;
    animation:tick 42s linear infinite;
  }
  #ticker:hover #tickerInner{ animation-play-state:paused; }
  @keyframes tick{ to{ transform:translateX(-50%); } }
  .half{ display:flex; align-items:center; }
  .ti{
    display:flex; align-items:center; gap:10px; padding-right:20px;
    font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600; letter-spacing:.22em;
    white-space:nowrap;
  }
  .ti i{ width:11px; height:11px; border:2px solid #f2ecdf; display:inline-block; }
  .star{ color:var(--acc); padding-right:20px; font-size:12px; transition:color .5s; }

  /* loader */
  #loader{
    position:fixed; inset:0; z-index:10; background:var(--bg);
    display:grid; place-items:center; transition:opacity .8s;
  }
  #loader.done{ opacity:0; pointer-events:none; }
  .l-in{ text-align:center; }
  .l-in .chip{ font-size:22px; padding:12px 24px; letter-spacing:.22em; text-indent:.22em; box-shadow:8px 8px 0 #141414; }
  .l-bar{
    width:150px; height:16px; margin:30px auto 18px;
    border:3px solid #141414; background:var(--paper); overflow:hidden;
  }
  .l-bar i{
    display:block; height:100%; width:0;
    background:repeating-linear-gradient(-45deg, var(--acc) 0 10px, #141414 10px 20px);
    animation:lfill 1.3s cubic-bezier(.6,0,.2,1) forwards;
  }
  #pToggleBadge{ display:none; }
  .m-title{ display:none; }

  @keyframes lfill{ to{ width:100%; } }
  .l-in p{
    margin:0; font-family:'IBM Plex Mono',monospace; font-size:9px; font-weight:600;
    letter-spacing:.28em; color:#141414; line-height:2.1;
  }

  @media (max-width:820px){
    #rail, #hint, #mark .tag, .cnr{ display:none; }
    #mark{ top:14px; left:14px; max-width:calc(100vw - 140px); }
    #mark .chip{ padding:6px 12px; font-size:13px; letter-spacing:.16em; text-indent:.16em; box-shadow:3px 3px 0 #141414; }
    #ovBtn{
      top:14px; right:14px; padding:8px 12px; font-size:8.5px; letter-spacing:.12em;
      max-width:calc(100vw - 130px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }

    /* Make background clearly visible on mobile (no opaque horizontal cream wash) */
    #scrim{
      background:linear-gradient(180deg, rgba(242,236,223,0) 60%, rgba(242,236,223,.5) 100%);
      opacity:.25;
      transition:opacity .35s ease;
    }
    body.panel-open #scrim{
      opacity:.85;
      background:rgba(242,236,223,.75);
    }

    /* Collapsed card by default on mobile to keep 3D background visible */
    #panel{
      left:12px; right:12px; width:auto; max-width:calc(100vw - 24px); bottom:108px;
      padding:10px 12px;
      pointer-events:auto;
      cursor:pointer;
      user-select:none;
      max-height:50px;
      overflow:hidden;
      overflow-x:hidden;
      box-shadow:4px 4px 0 #141414;
      border:2.5px solid #141414;
      box-sizing:border-box;
      transition:max-height .35s cubic-bezier(.2,0,.2,1), padding .3s ease, box-shadow .2s ease, opacity .5s ease, transform .5s ease;
      -webkit-tap-highlight-color:transparent;
    }

    /* Expanded card when tapped */
    #panel.expanded{
      max-height:min(64vh, 500px);
      overflow-y:auto;
      overflow-x:hidden;
      padding:16px 14px 14px;
      box-shadow:5px 5px 0 #141414;
      -webkit-overflow-scrolling:touch;
    }

    .p-kicker{
      display:flex; align-items:center; gap:8px; width:100%; max-width:100%;
    }
    #pChip{
      width:30px; height:30px; font-size:13px; border:2px solid #141414; box-shadow:2px 2px 0 #141414;
      flex:none;
    }
    .p-title-wrap{
      display:flex; flex-direction:column; justify-content:center; flex:1; min-width:0; overflow:hidden;
    }
    .m-title{
      display:block; font-size:13px; font-weight:700; text-transform:uppercase;
      letter-spacing:.04em; color:#141414; line-height:1.2;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    #pKicker{
      font-size:8.5px; letter-spacing:.14em; color:#55504a;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      line-height:1.2; margin-top:2px;
    }

    /* Mobile toggle badge on the right */
    #pToggleBadge{
      display:inline-flex; align-items:center; gap:5px;
      background:#141414; color:#f2ecdf;
      font-family:'IBM Plex Mono',monospace; font-size:9px; font-weight:700; letter-spacing:.16em;
      padding:5px 9px; border:1.5px solid #141414; box-shadow:2px 2px 0 var(--acc);
      flex:none; cursor:pointer;
      transition:background-color .2s, color .2s, box-shadow .2s;
    }
    #panel.expanded #pToggleBadge{
      background:var(--acc); color:#141414; box-shadow:2px 2px 0 #141414;
    }

    /* Hide detailed body elements when collapsed */
    #ghost{ display:none; }
    #pName{
      margin:12px 0 8px; font-size:24px; border-bottom-width:4px;
      display:none; max-width:100%; overflow-wrap:break-word; word-break:break-word;
    }
    #pBody{ font-size:12.5px; line-height:1.55; margin:0 0 12px; display:none; max-width:100%; overflow-wrap:break-word; word-break:break-word; }
    .p-row{ padding:6px 0; font-size:9px; display:none; max-width:100%; }
    .p-row .val{ overflow-wrap:break-word; word-break:break-word; }

    /* Reveal detailed body elements when expanded */
    #panel.expanded #pName{ display:inline-block; }
    #panel.expanded #pBody{ display:block; }
    #panel.expanded .p-row{ display:grid; }

    #nav{ right:14px; bottom:52px; }
    #toast{ bottom:114px; max-width:min(480px, calc(100vw - 24px)); }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

  }

</script>

<body>

<canvas id="scene"></canvas>
<div id="scrim"></div>

<span class="cnr" style="top:88px; left:44px;">+</span>
<span class="cnr" style="top:88px; right:44px;">+</span>
<span class="cnr" style="bottom:64px; left:44px;">+</span>

<header id="mark">
  <span class="chip">OPEN TECH INC.</span><br>
  <span class="tag">OPEN-AIR MONUMENTS PARK &amp; SDLC RESEARCH SANCTUARY</span>
</header>

<button id="ovBtn"><span id="ovLabel">VIEW THE SANCTUARY</span></button>

<nav id="rail"></nav>

<aside id="panel">
  <div id="ghost" aria-hidden="true">01</div>
  <div class="p-in">
    <div class="p-kicker">
      <span id="pChip">01</span>
      <div class="p-title-wrap">
        <span id="pMobileTitle" class="m-title">PLANNING</span>
        <span id="pKicker">CHART THE COURSE</span>
      </div>
      <button id="pToggleBadge" type="button" aria-label="Toggle details">
        <span class="tb-label">DETAILS</span> <span class="tb-icon">▲</span>
      </button>
    </div>
    <h2 id="pName">Planning</h2>
    <p id="pBody"></p>
    <div class="p-row"><span class="lbl">ARTIFACT</span><span class="val" id="pArtifact"></span></div>
    <div class="p-row"><span class="lbl">OUTPUTS</span><span class="val" id="pOutputs"></span></div>
    <div class="p-row"><span class="lbl">WATCH</span><span class="val" id="pWatch"></span></div>
  </div>
</aside>

<div id="nav">
  <div class="btns">
    <button class="nbtn" id="prevBtn" aria-label="Previous phase">
      <svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg>

    <button class="nbtn" id="nextBtn" aria-label="Next phase">
      <svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8"/></svg>

</div>

<div id="toast"></div>
<div id="prog"><div id="progFill"></div></div>
<div id="ticker"><div id="tickerInner"></div></div>

<div id="loader">
  <div class="l-in">
    <span class="chip">OPEN TECH INC.</span>
    <div class="l-bar"><i></i></div>
    <p>OPEN TECH INC. · SDLC RESEARCH SANCTUARY<br>ASSEMBLING SEVEN SPECIMENS</p>
  </div>
</div>

   PHASE DATA — pop palette, copy, artifact builders

function makeValleyGrassTexture(){
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  // Cheerful bright spring-valley lawn base
  ctx.fillStyle = '#5ac734';
  ctx.fillRect(0, 0, 512, 512);

  // Soft lush gradient mottling
  const greens = ['#52be2b', '#68d43f', '#46b222', '#74de4b', '#3ea41a', '#84e85d', '#5fc733'];
  for(let i = 0; i < 4800; i++){
    ctx.fillStyle = greens[Math.floor(Math.random() * greens.length)];
    const x = Math.random() * 512, y = Math.random() * 512;
    ctx.fillRect(x, y, 2 + Math.random() * 3.5, 3 + Math.random() * 6);
  }

  // Cute hand-drawn grass blade tufts (little stylized V-tufts)
  ctx.strokeStyle = '#369216';
  ctx.lineWidth = 2.2;
  for(let i = 0; i < 300; i++){
    const gx = Math.random() * 512, gy = Math.random() * 512;
    ctx.beginPath();
    ctx.moveTo(gx, gy + 8);
    ctx.lineTo(gx - 3.5, gy);
    ctx.moveTo(gx, gy + 8);
    ctx.lineTo(gx + 3.5, gy - 2);
    ctx.stroke();

    // Leaf tip highlight
    ctx.fillStyle = '#a2f67c';
    ctx.fillRect(gx - 4, gy - 1, 2, 2);
    ctx.fillRect(gx + 3, gy - 3, 2, 2);
  }

  // Cute 3-leaf clover / shamrock patches
  for(let i = 0; i < 95; i++){
    const cx = Math.random() * 512, cy = Math.random() * 512;
    ctx.fillStyle = '#2c8211';
    [-3, 3].forEach(ox => {
      ctx.beginPath(); ctx.arc(cx + ox, cy, 3, 0, Math.PI * 2); ctx.fill();
    });
    ctx.beginPath(); ctx.arc(cx, cy - 3.5, 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#8bf060';
    ctx.fillRect(cx - 1, cy - 1, 2, 2);
  }

  // Cute cartoony daisies & buttercups (white, yellow, & pastel pink pop blossoms)
  for(let i = 0; i < 150; i++){
    const fx = Math.random() * 512, fy = Math.random() * 512;
    const isDaisy = (i % 2 === 0);
    ctx.fillStyle = isDaisy ? '#ffffff' : (i % 3 === 0 ? '#ffea75' : '#ffaec0');
    for(let a = 0; a < Math.PI * 2; a += Math.PI / 2.5){
      ctx.beginPath();
      ctx.arc(fx + Math.cos(a) * 3.5, fy + Math.sin(a) * 3.5, 2.2, 0, Math.PI * 2);
      ctx.fill();
    }
    // Flower center
    ctx.fillStyle = isDaisy ? '#ffd02f' : '#ff7a1a';
    ctx.beginPath();
    ctx.arc(fx, fy, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(16, 16);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeBrickTexture(){
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  // Sand / mortar grout base
  ctx.fillStyle = '#ded5c7';
  ctx.fillRect(0, 0, 512, 512);

  // Warm terracotta brick shades with authentic variation
  const brickShades = ['#c85d3e', '#d46b4c', '#be5234', '#da795a', '#b0492c', '#df8566', '#c45738', '#ce6446'];
  const brickH = 26;
  const brickW = 60;
  const mortar = 4;

  for(let y = 2; y < 512; y += (brickH + mortar)){
    const row = Math.floor(y / (brickH + mortar));
    const offsetX = (row % 2) * (brickW / 2 + mortar / 2);
    for(let x = -brickW; x < 512 + brickW; x += (brickW + mortar)){
      const colIdx = Math.abs(Math.floor(x / (brickW + mortar)) + row * 7) % brickShades.length;
      ctx.fillStyle = brickShades[colIdx];
      const bx = x + offsetX;
      ctx.fillRect(bx, y, brickW, brickH);

      // Sunlit top & left bevel highlight
      ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
      ctx.fillRect(bx, y, brickW, 3);
      ctx.fillRect(bx, y, 3, brickH);

      // Bottom & right bevel shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
      ctx.fillRect(bx, y + brickH - 3, brickW, 3);
      ctx.fillRect(bx + brickW - 3, y, 3, brickH);

      // Fine clay texture specks
      ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
      ctx.fillRect(bx + 8, y + 6, 4, 3);
      ctx.fillRect(bx + 26, y + 14, 5, 2);
      ctx.fillRect(bx + 42, y + 8, 3, 3);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(1, 42);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

  const dogBreeds = [

  const dogs = dogBreeds.map((db, i) => {

  // Animation Update Function for the entire valley park
  return {
    update(t, dt){
      // 1. Rabbits hopping & idle behaviour
      bunnies.forEach((b) => {
        if(b.state === 'hop'){
          b.hopPhase += dt * b.hopSpeed;
          const hopArc = Math.abs(Math.sin(b.hopPhase * Math.PI)) * 0.22;
          b.obj.group.position.y = hopArc;
          // Move toward target
          const dx = b.target.x - b.pos.x;
          const dz = b.target.z - b.pos.z;
          const dist = Math.hypot(dx, dz);
          if(dist > 0.15){
            const step = Math.min(dist, dt * 1.35);
            b.pos.x += (dx / dist) * step;
            b.pos.z += (dz / dist) * step;
            b.obj.group.position.x = b.pos.x;
            b.obj.group.position.z = b.pos.z;
            const targetRot = Math.atan2(dx, dz);
            b.obj.group.rotation.y = THREE.MathUtils.lerp(b.obj.group.rotation.y, targetRot, 0.15);
            // Dynamic ear flutter with hop
            b.obj.earL.rotation.x = -0.22 - Math.sin(b.hopPhase * Math.PI * 2) * 0.15;
            b.obj.earR.rotation.x = -0.22 - Math.sin(b.hopPhase * Math.PI * 2) * 0.15;
          } else {
            // Reached target -> transition to idle
            b.state = 'idle';
            b.pauseTimer = 1.6 + Math.random() * 2.8;
            b.obj.group.position.y = 0;
          }

          b.obj.group.position.y = 0;

          b.obj.earR.rotation.z =  0.15 + Math.sin(t * 12 + 1) * 0.12;

            const newRad = THREE.MathUtils.clamp(b.baseRad + (Math.random() - 0.5) * 5, 5, 26);
            b.target.set(Math.cos(newAng) * newRad, 0, Math.sin(newAng) * newRad);
            b.state = 'hop';
            b.hopPhase = 0;
          }
        }
      });

      // 2. Dogs trotting & sniffing behaviour
      dogs.forEach((d) => {
        d.trotCadence += dt * d.speed * 8;
        // Tail wagging constantly

        const dx = d.target.x - d.pos.x;
        const dz = d.target.z - d.pos.z;
        const dist = Math.hypot(dx, dz);

        if(dist > 0.25){
          const step = Math.min(dist, dt * d.speed);
          d.pos.x += (dx / dist) * step;
          d.pos.z += (dz / dist) * step;
          d.obj.group.position.x = d.pos.x;
          d.obj.group.position.z = d.pos.z;
          const targetRot = Math.atan2(dx, dz);
          d.obj.group.rotation.y = THREE.MathUtils.lerp(d.obj.group.rotation.y, targetRot, 0.12);

          // Diagonal 4-leg trotting swing
          d.obj.legFL.rotation.x =  Math.sin(d.trotCadence) * 0.45;
          d.obj.legBR.rotation.x =  Math.sin(d.trotCadence) * 0.45;
          d.obj.legFR.rotation.x = -Math.sin(d.trotCadence) * 0.45;
          d.obj.legBL.rotation.x = -Math.sin(d.trotCadence) * 0.45;
          d.obj.group.position.y = Math.abs(Math.sin(d.trotCadence * 2)) * 0.03;
          d.obj.head.rotation.x = Math.sin(d.trotCadence) * 0.06;
        } else {
          // Pause to sniff grass
          d.obj.legFL.rotation.x = 0; d.obj.legFR.rotation.x = 0;
          d.obj.legBL.rotation.x = 0; d.obj.legBR.rotation.x = 0;
          d.obj.head.rotation.x = -0.18 + Math.sin(t * 6) * 0.08; // sniffing down

            const newRad = 8 + Math.random() * 14;
            d.target.set(Math.cos(newAng) * newRad, 0, Math.sin(newAng) * newRad);
          }

        bf.wR.rotation.y = -flap;

        bf.group.rotation.y = bAng + Math.PI / 2;
      });

      godRayMat.opacity = 0.09 + Math.sin(t * 1.2) * 0.02;
      sunCore.scale.setScalar(1 + Math.sin(t * 1.8) * 0.025);
      sunG.position.y = 21.0 + Math.sin(t * 0.8) * 0.3;

      // 8. Subtle Sunday Clouds drifting serenely across high altitude
      clouds.forEach((cl) => {
        cl.ang += dt * cl.speed;
        cl.group.position.x = Math.cos(cl.ang) * cl.rad;
        cl.group.position.z = Math.sin(cl.ang) * cl.rad;
        cl.group.position.y = cl.baseAlt + Math.sin(t * 0.8 + cl.rad) * 0.2;
        cl.group.rotation.y = -cl.ang + Math.PI / 2;
      });
    }
  };
})();

/* confetti — slow pop rain */
const confetti = (()=>{
  const COLORS = ['#FFD02F','#FF6B9D','#8B5CF6','#FF7A1A','#4ADE80','#38BDF8','#FF5C5C'];
  const N = 130;
  const im = new THREE.InstancedMesh(
    new THREE.PlaneGeometry(0.2,0.13),
    new THREE.MeshBasicMaterial({ side:THREE.DoubleSide }), N);
  im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  const base = [];
  const col = new THREE.Color();
  for(let i=0;i<N;i++){
    const r = 4 + Math.random()*26, a = Math.random()*Math.PI*2;
    base.push({ x:Math.cos(a)*r, z:Math.sin(a)*r, y:Math.random()*12,
                sp:0.25+Math.random()*0.35, rx:Math.random()*7, ry:Math.random()*7, ph:Math.random()*7 });
    im.setColorAt(i, col.set(COLORS[i%7]));
  }
  im.instanceColor.needsUpdate = true;
  scene.add(im);
  const dummy = new THREE.Object3D();
  return { update(t,dt){
    base.forEach((b,i)=>{
      b.y -= dt*b.sp; if(b.y < 0.1) b.y = 12;
      dummy.position.set(b.x + Math.sin(t*0.8+b.ph)*0.5, b.y, b.z);
      dummy.rotation.set(b.ph + t*b.rx, t*b.ry, 0);
      dummy.updateMatrix();
      im.setMatrixAt(i, dummy.matrix);
    });
    im.instanceMatrix.needsUpdate = true;
  }};
})();

// 01 · THE SPRINT MATRIX — Planning (Kanban board, animated story cards, velocity radar)
function buildSprintMatrix(acc){
  const g = new THREE.Group();

  // ── Floor Platform ──────────────────────────────────────────────────────────
  const floorPlate = outline(new THREE.Mesh(new THREE.CylinderGeometry(2.15, 2.15, 0.12, 32), toon(0xfdfaf3)), 1.03);
  floorPlate.position.y = 0.06;
  g.add(floorPlate);

  // Floor grid marks
  const matLineSoft = new THREE.LineBasicMaterial({ color: 0xd0cbb8, transparent: true, opacity: 0.55 });
  for(let i = -1.8; i <= 1.8; i += 0.6){
    const lineX = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(i, 0.125, -1.6), new THREE.Vector3(i, 0.125, 1.6)]),
      matLineSoft
    );
    g.add(lineX);
  }

  // ── Rear partition / wall ───────────────────────────────────────────────────
  const backRail = outline(new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.42, 0.08), matBlack), 1.05);
  backRail.position.set(0, 0.33, -1.5);
  g.add(backRail);
  const glassTop = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.22, 0.04), toon(acc));
  glassTop.position.set(0, 0.62, -1.5);
  g.add(glassTop);

  // ── Kanban Wall Board (large physical whiteboard on wall) ───────────────────
  const boardG = new THREE.Group();
  boardG.position.set(0, 1.45, -1.42);
  g.add(boardG);

  // Board backing
  const boardBack = outline(new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.8, 0.08), toon(0xfdfaf3)), 1.025);
  boardG.add(boardBack);

  // Top header strip (accent colour banner)
  const boardHeader = new THREE.Mesh(new THREE.BoxGeometry(2.62, 0.24, 0.10), matBlack);
  boardHeader.position.y = 0.87;
  boardG.add(boardHeader);
  const headerAccent = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.12, 0.02), toon(acc));
  headerAccent.position.set(0, 0.87, 0.06);
  boardG.add(headerAccent);

  // 3 column dividers on the board
  [-0.62, 0.62].forEach(bx => {
    const div = new THREE.Mesh(new THREE.BoxGeometry(0.04, 1.5, 0.10), matBlack);
    div.position.set(bx, -0.04, 0.01);
    boardG.add(div);
  });

  // Column label chips (BACKLOG | IN PROGRESS | DONE)
  const boardCols = [-1.0, 0, 1.0];
  const boardChipColors = [0x141414, acc, 0x4ADE80];
  boardCols.forEach((bx, i) => {
    const chip = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.11, 0.04), i === 0 ? matBlack : toon(boardChipColors[i]));
    chip.position.set(bx, 0.68, 0.06);
    boardG.add(chip);
  });

  // Sticky-note cards on the board (these will animate)
  const stickyGeo = new THREE.BoxGeometry(0.42, 0.28, 0.04);
  const stickyData = [
    { col: 0, row: 0, color: acc,       speed: 0.55, offset: 0.0 },
    { col: 0, row: 1, color: 0xFBBF24,  speed: 0.70, offset: 2.1 },
    { col: 0, row: 2, color: 0xfdfaf3,  speed: 0.0,  offset: 0.0 },
    { col: 1, row: 0, color: acc,       speed: 0.0,  offset: 0.0 },
    { col: 1, row: 1, color: 0x38BDF8,  speed: 0.0,  offset: 0.0 },
    { col: 2, row: 0, color: 0x4ADE80,  speed: 0.0,  offset: 0.0 },
    { col: 2, row: 1, color: 0xfdfaf3,  speed: 0.0,  offset: 0.0 },
  ];

  const stickyMeshes = stickyData.map(sd => {
    const sm = outline(new THREE.Mesh(stickyGeo, toon(sd.color)), 1.1);
    // tiny ruled lines on each sticky
    for(let li = 0; li < 3; li++){
      const ruled = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.018, 0.02), matBlack);
      ruled.position.set(0.04, 0.07 - li * 0.07, 0.024);
      sm.add(ruled);
    }
    g.add(sm);
    return sm;
  });

  // ── Standing lamp (corner accent) ──────────────────────────────────────────
  const lampPole = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 1.6, 8), matBlack);
  lampPole.position.set(-1.7, 0.92, -1.2);
  g.add(lampPole);
  const lampHead = outline(new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 8), toon(0xFBBF24)), 1.15);
  lampHead.position.set(-1.7, 1.72, -1.2);
  g.add(lampHead);

  // ── Round brainstorm table with chairs ─────────────────────────────────────
  const tableG = new THREE.Group();
  tableG.position.set(0.75, 0.12, 0.65);
  g.add(tableG);

  const tableTop = outline(new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.06, 20), toon(0xfdfaf3)), 1.04);
  tableTop.position.y = 0.5;
  tableG.add(tableTop);
  const tableStem = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.06, 0.5, 10), matBlack);
  tableStem.position.y = 0.25;
  tableG.add(tableStem);
  const tableBase = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.04, 10), matBlack);
  tableBase.position.y = 0.02;
  tableG.add(tableBase);

  // Chairs around table (facing center of table)
  // Chair 1 for Worker C (dev), Chair 2 for Worker B (scrum master / partner)
  const chairG1 = new THREE.Group();
  chairG1.position.set(0.48, 0, 0);
  chairG1.rotation.y = -Math.PI / 2; // faces towards center (-x)
  const chSeat1 = outline(new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.05, 0.32), toon(0xfdfaf3)), 1.08);
  chSeat1.position.y = 0.36;
  chairG1.add(chSeat1);
  const chBack1 = outline(new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.28, 0.045), matBlack), 1.08);
  chBack1.position.set(0, 0.54, 0.14);
  chairG1.add(chBack1);
  const chStem1 = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.33, 7), matBlack);
  chStem1.position.y = 0.17;
  chairG1.add(chStem1);
  tableG.add(chairG1);

  const chairG2 = new THREE.Group();
  chairG2.position.set(-0.48, 0, 0);
  chairG2.rotation.y = Math.PI / 2; // faces towards center (+x)
  const chSeat2 = outline(new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.05, 0.32), toon(0xfdfaf3)), 1.08);
  chSeat2.position.y = 0.36;
  chairG2.add(chSeat2);
  const chBack2 = outline(new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.28, 0.045), matBlack), 1.08);
  chBack2.position.set(0, 0.54, 0.14);
  chairG2.add(chBack2);
  const chStem2 = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.33, 7), matBlack);
  chStem2.position.y = 0.17;
  chairG2.add(chStem2);
  tableG.add(chairG2);

  // Coffee mug on table
  const tableMug = outline(new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.08, 10), toon(acc)), 1.12);
  tableMug.position.set(-0.15, 0.565, 0.15);
  tableG.add(tableMug);

  // Notepad / tablet on table
  const notepad = outline(new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.015, 0.28), toon(0xFBBF24)), 1.08);
  notepad.position.set(0.12, 0.535, -0.05);
  tableG.add(notepad);

  // ── Worker factory ──────────────────────────────────────────────────────────
  const makeWorker = (shirtHex, hasLaptop=false) => {
    const wg = new THREE.Group();

    const legGeo = new THREE.BoxGeometry(0.07, 0.24, 0.07);
    const legL = outline(new THREE.Mesh(legGeo, matBlack), 1.1);
    legL.position.set(-0.06, 0.12, 0);
    const legR = outline(new THREE.Mesh(legGeo, matBlack), 1.1);
    legR.position.set(0.06, 0.12, 0);
    wg.add(legL, legR);

    const torso = outline(new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.28, 0.15), toon(shirtHex)), 1.08);
    torso.position.y = 0.38;
    wg.add(torso);

    const armGeo = new THREE.BoxGeometry(0.06, 0.22, 0.06);
    const armL = outline(new THREE.Mesh(armGeo, toon(shirtHex)), 1.1);
    armL.position.set(-0.16, 0.36, 0);
    const armR = outline(new THREE.Mesh(armGeo, toon(shirtHex)), 1.1);
    armR.position.set(0.16, 0.36, 0);
    wg.add(armL, armR);

    const head = outline(new THREE.Mesh(new THREE.SphereGeometry(0.1, 14, 10), toon(0xfdfaf3)), 1.1);
    head.position.y = 0.62;
    wg.add(head);

    const hair = new THREE.Mesh(new THREE.SphereGeometry(0.106, 12, 8), matBlack);
    hair.position.set(0, 0.64, -0.02);
    hair.scale.set(1, 0.7, 1);
    wg.add(hair);

    let tablet = null;
    if(hasLaptop){
      tablet = outline(new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.14, 0.02), toon(0x38BDF8)), 1.1);
      tablet.position.set(0, 0.34, 0.16);
      tablet.rotation.x = Math.PI / 4;
      wg.add(tablet);
    }

    g.add(wg);
    return { group: wg, legL, legR, armL, armR, head, torso, tablet };
  };

  // Worker A — Board Manager: walks to board, picks card, moves it
  const workerA = makeWorker(acc, false);
  workerA.group.position.set(-0.6, 0.12, -0.55);
  workerA.group.rotation.y = 0; // faces board

  // Helper to place and pose seated workers properly on their chairs
  const seatWorker = (w, worldX, worldZ, rotY) => {
    w.group.position.set(worldX, 0.22, worldZ);
    w.group.rotation.y = rotY;
    // Thighs horizontal forward resting on chair cushion
    w.legL.rotation.x = -Math.PI / 2.1;
    w.legL.position.set(-0.06, 0.21, 0.11);
    w.legR.rotation.x = -Math.PI / 2.1;
    w.legR.position.set(0.06, 0.21, 0.11);
    // Arms forward resting over the tabletop
    w.armL.rotation.x = -Math.PI / 3.2;
    w.armR.rotation.x = -Math.PI / 3.2;
  };

  // Worker B — Scrum Master: seated at left side of table facing Worker C
  const workerB = makeWorker(0x8B5CF6, false);
  seatWorker(workerB, 0.75 - 0.48, 0.65, Math.PI / 2);

  // Worker C — Dev Team member: seated at right side of table facing Worker B
  const workerC = makeWorker(0x4ADE80, true);
  seatWorker(workerC, 0.75 + 0.48, 0.65, -Math.PI / 2);

  // Overhead planning arc
  const planArch = ringTwin(1.85, 0.035, acc);
  planArch.rotation.x = Math.PI / 2.3;
  planArch.rotation.z = Math.PI / 5;
  planArch.position.set(0, 0.8, 0);
  g.add(planArch);

  const planPulse = outline(new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 8), toon(acc)), 1.2);
  g.add(planPulse);

  // Waypoints for worker A patrolling board columns (Backlog → InProgress → Done → step back)
  const boardZ = -1.1;
  const boardY  = 0.12;
  const wpA = [
    new THREE.Vector3(-1.0,  boardY, boardZ),   // stand at Backlog column
    new THREE.Vector3(-1.0,  boardY, boardZ - 0.05), // lean into board
    new THREE.Vector3( 0.0,  boardY, boardZ),   // slide to InProgress
    new THREE.Vector3( 0.0,  boardY, boardZ - 0.05), // lean in
    new THREE.Vector3( 1.0,  boardY, boardZ),   // slide to Done column
    new THREE.Vector3(-0.5,  boardY, -0.3),     // step back to see the board
  ];

  // Speech-bubble mesh (small diamond floating above worker B / C when they "talk")
  const makeBubble = (col) => {
    const bubG = new THREE.Group();
    const bubBase = outline(new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.12, 0.04), toon(0xfdfaf3)), 1.12);
    bubBase.position.y = 0;
    bubG.add(bubBase);
    const bubTail = new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.07, 4), toon(0xfdfaf3));
    bubTail.rotation.z = Math.PI;
    bubTail.position.set(-0.04, -0.1, 0);
    bubG.add(bubTail);
    const bubDot1 = new THREE.Mesh(new THREE.SphereGeometry(0.02, 6, 6), toon(col));
    bubDot1.position.set(-0.04, 0, 0.025);
    bubG.add(bubDot1);
    const bubDot2 = new THREE.Mesh(new THREE.SphereGeometry(0.02, 6, 6), toon(col));
    bubDot2.position.set(0.02, 0, 0.025);
    bubG.add(bubDot2);
    g.add(bubG);
    return bubG;
  };

  const bubbleB = makeBubble(acc);
  const bubbleC = makeBubble(0x4ADE80);

  // ── Animation ───────────────────────────────────────────────────────────────
  g.userData.update = (t, dt) => {

    // Sticky cards animate across board columns
    stickyData.forEach((sd, idx) => {
      const sm = stickyMeshes[idx];
      const rowY  = 1.45 + sd.row * 0.38 - 0.38;         // row y on wall board
      const boardXs = [-1.0, 0.0, 1.0];

      if(sd.speed > 0){
        const cycle = (t * sd.speed + sd.offset) % 4.0;
        let bx, hopZ = 0;
        if(cycle < 1.3){
          bx = boardXs[0];
        } else if(cycle < 1.7){
          const k = (cycle - 1.3) / 0.4;
          bx = THREE.MathUtils.lerp(boardXs[0], boardXs[1], k);
          hopZ = Math.sin(k * Math.PI) * 0.08;
        } else if(cycle < 2.7){
          bx = boardXs[1];
        } else if(cycle < 3.1){
          const k = (cycle - 2.7) / 0.4;
          bx = THREE.MathUtils.lerp(boardXs[1], boardXs[2], k);
          hopZ = Math.sin(k * Math.PI) * 0.08;
        } else {
          bx = boardXs[2];
        }
        sm.position.set(bx, rowY, -1.38 + hopZ);
        sm.rotation.z = Math.sin(t * 2 + idx) * 0.04;
      } else {
        const bx = boardXs[sd.col];
        sm.position.set(bx, rowY + Math.sin(t * 1.5 + idx) * 0.008, -1.38);
        sm.rotation.z = Math.sin(t * 0.8 + idx * 1.2) * 0.025;
      }
    });

    // Worker A — board manager walks between columns, reaches up to move cards
    const waDur = 9.0;
    const waP = (t % waDur) / waDur;
    const waSeg = Math.floor(waP * wpA.length);
    const waT = (waP * wpA.length) % 1.0;
    const waP0 = wpA[waSeg];
    const waP1 = wpA[(waSeg + 1) % wpA.length];
    workerA.group.position.lerpVectors(waP0, waP1, waT);

    // Face the board
    const waDx = waP1.x - waP0.x, waDz = waP1.z - waP0.z;
    const waAng = Math.abs(waDx) + Math.abs(waDz) > 0.01 ? Math.atan2(waDx, waDz) : workerA.group.rotation.y;
    workerA.group.rotation.y = THREE.MathUtils.lerp(workerA.group.rotation.y, waAng, 0.12);

    // Arm raise when near board (lean-in waypoints 1 & 3)
    const nearBoard = (waSeg === 1 || waSeg === 3);
    const raiseAmt = nearBoard ? -Math.PI * 0.75 : 0;
    workerA.armL.rotation.x = THREE.MathUtils.lerp(workerA.armL.rotation.x, raiseAmt, 0.08);
    workerA.armR.rotation.x = THREE.MathUtils.lerp(workerA.armR.rotation.x, raiseAmt + Math.sin(t * 6) * 0.08, 0.08);

    // Walking bob for worker A
    const waWalk = t * 10;
    if(!nearBoard){
      workerA.legL.rotation.x = Math.sin(waWalk) * 0.4;
      workerA.legR.rotation.x = -Math.sin(waWalk) * 0.4;
      workerA.torso.position.y = 0.38 + Math.abs(Math.sin(waWalk * 2)) * 0.025;
    }

    // Worker B — Scrum Master talking (head bobs, animated gestures over table)
    workerB.head.rotation.y = Math.sin(t * 2.4) * 0.18;
    workerB.head.rotation.x = Math.sin(t * 1.6) * 0.08;
    workerB.armL.rotation.x = -Math.PI / 3.2 + Math.sin(t * 3.2) * 0.15;  // gesturing over table
    workerB.armL.rotation.z = 0.12 + Math.sin(t * 2.8) * 0.10;
    workerB.armR.rotation.x = -Math.PI / 3.2 + Math.sin(t * 2.5 + 1.0) * 0.12;

    // Worker C — Dev member nodding, typing on laptop
    workerC.head.rotation.x = -0.12 + Math.sin(t * 2.2) * 0.08;
    workerC.head.rotation.y = Math.sin(t * 1.8) * 0.10;
    workerC.armL.rotation.x = -Math.PI / 3.2 + Math.sin(t * 12) * 0.04;
    workerC.armR.rotation.x = -Math.PI / 3.2 + Math.sin(t * 12 + Math.PI) * 0.04;

    // Speech bubbles float above B & C, pulse in/out on conversation rhythm
    const talkPhase = t * 1.4;
    const bVis = (Math.sin(talkPhase) > 0.1) ? 1 : 0;
    const cVis = (Math.sin(talkPhase + Math.PI) > 0.1) ? 1 : 0;

    const bPos = workerB.group.position;
    bubbleB.position.set(bPos.x + 0.16, bPos.y + 1.0, bPos.z);
    bubbleB.scale.setScalar(bVis ? 1 + Math.sin(talkPhase * 3) * 0.06 : 0.001);

    const cPos = workerC.group.position;
    bubbleC.position.set(cPos.x - 0.16, cPos.y + 1.0, cPos.z);
    bubbleC.scale.setScalar(cVis ? 1 + Math.sin(talkPhase * 3 + Math.PI) * 0.06 : 0.001);

    // Overhead planning arc pulse
    const loopAng = t * 1.6;
    planPulse.position.set(Math.cos(loopAng) * 1.85, 0.8 + Math.sin(loopAng * 2) * 0.25, Math.sin(loopAng) * 0.9);
  };

  return g;
}

// 02 · THE SPEC PARSER — Analysis (Tokenizer core, streaming input payloads, branching AST tree)
function buildSpecParser(acc){
  const g = new THREE.Group();

  // Central Tokenizer / Parser Core
  const coreG = new THREE.Group();
  coreG.position.set(0, 1.65, 0);
  g.add(coreG);

  const coreBody = outline(new THREE.Mesh(new THREE.CylinderGeometry(0.68, 0.68, 0.55, 6), toon(acc)), 1.05);
  coreG.add(coreBody);
  const coreEdges = new THREE.LineSegments(new THREE.EdgesGeometry(coreBody.geometry), matLineBlack);
  coreG.add(coreEdges);

  // Floating schema inspection rings tilted around parser core
  const scanRing = ringTwin(1.05, 0.035, acc);
  scanRing.rotation.x = Math.PI / 3;
  coreG.add(scanRing);

  // Inbound Raw Requirement Stream (left side -> feeds into parser)
  const inStream = new THREE.Group();
  g.add(inStream);
  const inGuide = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-2.1, 1.65, 0), new THREE.Vector3(-0.7, 1.65, 0)]),
    matLineBlack
  );
  inStream.add(inGuide);

  const rawPackets = [];
  for(let k=0; k<4; k++){
    const rawBox = outline(new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.22, 0.22), toon(0xfdfaf3)), 1.1);
    rawBox.add(new THREE.LineSegments(new THREE.EdgesGeometry(rawBox.geometry), matLineBlack));
    inStream.add(rawBox);
    rawPackets.push({ mesh: rawBox, offset: k * 0.25 });
  }

  // Outbound AST / Logic Tree Nodes (right side branching out)
  const outTree = new THREE.Group();
  g.add(outTree);

  // Branch 1: Decision Diamond <IF/VALIDATE> (top right)
  const ifDiamond = outline(new THREE.Mesh(new THREE.OctahedronGeometry(0.32, 0), toon(acc)), 1.1);
  ifDiamond.position.set(1.4, 2.4, 0.2);
  ifDiamond.add(new THREE.LineSegments(new THREE.EdgesGeometry(ifDiamond.geometry), matLineBlack));
  outTree.add(ifDiamond);

  // Branch 2: Functional Spec Block [SRS_MODULE] (mid right)
  const specBlock = outline(new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.32, 0.2), toon(0xfdfaf3)), 1.08);
  specBlock.position.set(1.65, 1.65, -0.2);
  // Lines representing structured spec text
  for(let l=0; l<3; l++){
    const tl = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.03, 0.22), matBlack);
    tl.position.set(0, 0.08 - l*0.08, 0);
    specBlock.add(tl);
  }
  outTree.add(specBlock);

  // Branch 3: Domain Data Model Schema Node (bottom right)
  const schemaNode = outline(new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.36, 12), toon(0xfdfaf3)), 1.08);
  schemaNode.position.set(1.35, 0.85, 0.25);
  const schemaGroove = new THREE.Mesh(new THREE.TorusGeometry(0.365, 0.03, 6, 24), matBlack);
  schemaGroove.rotation.x = Math.PI / 2;
  schemaNode.add(schemaGroove);
  outTree.add(schemaNode);

  // Logic bus lines connecting central parser to the 3 branches
  const busCoords = [
    [new THREE.Vector3(0.65, 1.65, 0), new THREE.Vector3(1.4, 2.4, 0.2)],
    [new THREE.Vector3(0.65, 1.65, 0), new THREE.Vector3(1.65, 1.65, -0.2)],
    [new THREE.Vector3(0.65, 1.65, 0), new THREE.Vector3(1.35, 0.85, 0.25)]
  ];
  busCoords.forEach(pts => {
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), matLineBlack);
    g.add(line);
  });

  // Validation status check pips [OK]
  const pips = [ifDiamond, specBlock, schemaNode].map((node) => {
    const pip = outline(new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 8), toon(0x4ADE80)), 1.2);
    pip.position.set(0.22, 0.2, 0.1);
    node.add(pip);

  });

  g.userData.update = (t) => {
    // Core parser rotation and breathing
    coreG.rotation.y = t * 0.45;
    scanRing.rotation.z = t * 0.8;
    coreBody.scale.setScalar(1 + Math.sin(t * 3.5) * 0.04);

    // Inbound requirement packets flow towards the parser
    rawPackets.forEach(p => {
      const prog = (t * 0.5 + p.offset) % 1.0;
      p.mesh.position.set(-2.1 + prog * 1.45, 1.65 + Math.sin(t * 3 + p.offset * 6) * 0.05, 0);
      p.mesh.rotation.y = t + p.offset * 4;
    });

    // Branch nodes floating & validation pips
    ifDiamond.rotation.y = t * 0.8;
    ifDiamond.rotation.z = Math.sin(t) * 0.2;
    specBlock.position.y = 1.65 + Math.sin(t * 1.8) * 0.06;
    schemaNode.rotation.y = t * 0.5;
    pips.forEach((p, i) => p.scale.setScalar(1 + Math.sin(t * 4 + i * 1.5) * 0.25));
  };
  return g;
}

// 03 · THE CLOUD ARCHITECTURE — Design (Multi-tier: API Gateway, Microservice cluster, Database sync)

  // Tier 2 (Middle): Microservices Cluster Mesh (3 container nodes)
  const serviceGroup = new THREE.Group();
  g.add(serviceGroup);
  const sPos = [
    { x: -0.75, y: 1.45, z: 0.35, hex: 0x8B5CF6 },
    { x: 0.75, y: 1.45, z: 0.35, hex: 0x38BDF8 },

    const sBox = outline(new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.55, 0.55), toon(0xfdfaf3)), 1.06);
    sBox.position.set(pos.x, pos.y, pos.z);

    // Colored service badge / docker port notch

    badge.position.set(0, 0, 0.26);

  });

  // Central Event Bus message pipe running through services
  const busPipe = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.8, 10), matBlack);
  busPipe.rotation.z = Math.PI / 2;
  busPipe.position.set(0, 1.45, 0);
  g.add(busPipe);
  const busHub = outline(new THREE.Mesh(new THREE.SphereGeometry(0.16, 14, 10), toon(acc)), 1.12);
  busHub.position.set(0, 1.45, 0);
  g.add(busHub);

  // Network connection lines from Gateway to Services
  sPos.forEach(p => {
    const line = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(p.x * 0.7, 2.39, 0), new THREE.Vector3(p.x, p.y + 0.3, p.z)]),
      matLineBlack
    );
    g.add(line);
  });

  // Tier 3 (Bottom): Distributed Database Cluster (Primary & Replica)
  const dbs = [-0.62, 0.62].map((x) => {
    const dbG = new THREE.Group();
    dbG.position.set(x, 0.42, 0);
    // 3 stacked storage platters
    for(let l=0; l<3; l++){
      const platter = outline(new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.12, 20), toon(l===1?acc:0xfdfaf3)), 1.05);
      platter.position.y = l * 0.16;
      platter.add(new THREE.LineSegments(new THREE.EdgesGeometry(platter.geometry, 25), matLineSoft));
      dbG.add(platter);
    }
    g.add(dbG);
    return dbG;
  });

  // Database Replication Ring
  const repRing = ringTwin(0.72, 0.03, acc);
  repRing.rotation.x = Math.PI / 2;
  repRing.position.set(0, 0.55, 0);
  g.add(repRing);

  // Syncing replication data particle
  const syncBead = outline(new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 8), toon(0x38BDF8)), 1.2);
  g.add(syncBead);

  // Data flow vertical conduit between services and databases
  [-0.62, 0.62].forEach(x => {
    const dl = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x, 1.15, 0.2), new THREE.Vector3(x, 0.75, 0)]),
      matLineBlack
    );
    g.add(dl);
  });

  g.userData.update = (t) => {
    // Client request ingress pulses
    pingers.forEach(p => {
      const drop = (t * 2.2 + p.ph) % 1.0;
      p.mesh.position.y = 2.9 - drop * 0.3;
      p.mesh.scale.setScalar(0.7 + drop * 0.4);
    });

    // Microservices hover with phase offsets
    services.forEach((s, idx) => {
      s.mesh.position.y = s.basePos.y + Math.sin(t * 2.2 + idx * 1.6) * 0.06;
      s.mesh.rotation.y = Math.sin(t * 0.8 + idx) * 0.1;
    });

    // Central event bus hub pulse
    busHub.scale.setScalar(1 + Math.sin(t * 4) * 0.12);

    // Replication data bead orbiting between primary and replica
    const repAngle = t * 2.5;
    syncBead.position.set(Math.cos(repAngle) * 0.72, 0.55, Math.sin(repAngle) * 0.32);
  };
  return g;
}

// 04 · THE GIT COMPILER — Implementation (Git branch DAG, IDE syntax cards, assembling binary core)
function buildGitCompiler(acc){
  const g = new THREE.Group();

  // Git Branch DAG (Directed Acyclic Graph)
  const dagG = new THREE.Group();
  g.add(dagG);

  // Main branch trunk
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.4, 10), matBlack);
  trunk.position.set(-0.55, 1.35, 0);
  dagG.add(trunk);

  // Main branch commit nodes
  const mainCommits = [];
  [0.4, 0.95, 1.5, 2.05, 2.45].forEach((y) => {
    const c = outline(new THREE.Mesh(new THREE.SphereGeometry(0.12, 14, 10), toon(acc)), 1.15);
    c.position.set(-0.55, y, 0);
    dagG.add(c);
    mainCommits.push(c);
  });

  // Feature branch curve arcing out to x = 0.45 and merging back in at y = 1.95
  const featCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-0.55, 0.95, 0),
    new THREE.Vector3(0.15, 1.25, 0.3),
    new THREE.Vector3(0.35, 1.55, 0.2),
    new THREE.Vector3(-0.55, 2.05, 0)
  ]);
  const featTube = new THREE.Mesh(new THREE.TubeGeometry(featCurve, 24, 0.035, 8, false), matBlack);
  dagG.add(featTube);

  // Feature branch commit nodes
  const featCommits = [
    new THREE.Vector3(0.15, 1.25, 0.3),
    new THREE.Vector3(0.35, 1.55, 0.2)
  ].map(pos => {
    const fc = outline(new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 8), toon(0xfdfaf3)), 1.15);
    fc.position.copy(pos);
    dagG.add(fc);
    return fc;
  });

  // Pull Request Merge Gate [PR #42] at merge junction
  const prGate = outline(new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.18, 0.14), toon(0x4ADE80)), 1.1);
  prGate.position.set(-0.55, 2.05, 0);
  dagG.add(prGate);

  // Floating IDE Syntax Code Cards with indented code lines
  const codeCards = [];
  [
    { pos: [0.85, 2.1, -0.2], rotY: -0.3 },
    { pos: [-0.95, 0.85, 0.35], rotY: 0.4 }
  ].forEach(def => {
    const card = outline(new THREE.Mesh(new THREE.BoxGeometry(0.78, 0.52, 0.03), toon(0xfdfaf3)), 1.08);
    card.position.set(...def.pos);
    card.rotation.y = def.rotY;
    // Indented code syntax bars
    const indentW = [0.45, 0.35, 0.5, 0.28];
    indentW.forEach((w, l) => {
      const cl = new THREE.Mesh(new THREE.BoxGeometry(w, 0.035, 0.04), matBlack);
      cl.position.set(-0.35 + w/2 + (l%2)*0.08, 0.15 - l*0.09, 0);
      card.add(cl);
    });
    g.add(card);
    codeCards.push(card);
  });

  // Central Compiler / Assembler Core (center, y = 1.4)
  const compCore = outline(new THREE.Mesh(new THREE.IcosahedronGeometry(0.52, 0), toon(acc)), 1.08);
  compCore.position.set(0.1, 1.4, -0.1);
  g.add(compCore);
  const compWire = new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.DodecahedronGeometry(0.78, 0)), matLineBlack);
  compWire.position.copy(compCore.position);
  g.add(compWire);

  // Compiled Binary Release Executable hovering at top
  const binaryArtifact = outline(new THREE.Mesh(new THREE.OctahedronGeometry(0.28, 0), toon(0xFF7A1A)), 1.12);
  binaryArtifact.position.set(0.1, 2.38, -0.1);
  g.add(binaryArtifact);

  // Spiraling binary code bits feeding into compiler
  const BIT_COUNT = 32;
  const bitInst = new THREE.InstancedMesh(new THREE.BoxGeometry(0.09, 0.09, 0.09), matBlack, BIT_COUNT);
  bitInst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  const bits = [];
  for(let k=0; k<BIT_COUNT; k++){
    bits.push({
      rad: 0.6 + Math.random() * 0.9,
      angle: Math.random() * Math.PI * 2,
      sp: 0.8 + Math.random() * 0.8,
      yOff: -0.4 + Math.random() * 0.8
    });
  }
  g.add(bitInst);
  const dummy = new THREE.Object3D();

  g.userData.update = (t, dt) => {
    // Compiler rotation & pulse
    compCore.rotation.y = t * 1.1;
    compCore.rotation.x = t * 0.45;
    const pulse = 1 + Math.sin(t * 6) * 0.08;
    compCore.scale.setScalar(pulse);
    compWire.rotation.y = -t * 0.6;
    compWire.rotation.z = t * 0.3;

    // Compiled binary hover
    binaryArtifact.position.y = 2.38 + Math.sin(t * 3) * 0.08;
    binaryArtifact.rotation.y = t * 1.2;

    // Floating code cards gentle sway
    codeCards.forEach((c, idx) => {
      c.position.y += Math.sin(t * 1.8 + idx) * 0.002;
      c.rotation.z = Math.sin(t * 1.2 + idx) * 0.04;
    });

    // Commit node pulses
    mainCommits.forEach((c, i) => c.scale.setScalar(1 + Math.sin(t * 4 + i * 1.1) * 0.15));
    featCommits.forEach((c, i) => c.scale.setScalar(1 + Math.sin(t * 4 + i * 1.5 + 2) * 0.15));

    // Binary code bits spiraling into compiler
    bits.forEach((b, k) => {
      b.angle += dt * b.sp;
      const inR = b.rad * (0.8 + Math.sin(b.angle * 2) * 0.2);
      dummy.position.set(0.1 + Math.cos(b.angle) * inR, 1.4 + b.yOff + Math.sin(b.angle * 3) * 0.15, -0.1 + Math.sin(b.angle) * inR);
      dummy.rotation.set(b.angle, b.angle * 0.5, 0);
      dummy.updateMatrix();
      bitInst.setMatrixAt(k, dummy.matrix);
    });
    bitInst.instanceMatrix.needsUpdate = true;
  };
  return g;
}

  const makeWorker = (shirtHex, hasLaptop=false) => {

    wg.add(armL, armR);

    const head = outline(new THREE.Mesh(new THREE.SphereGeometry(0.1, 14, 10), toon(0xfdfaf3)), 1.1);
    head.position.y = 0.62;
    wg.add(head);

    const hair = new THREE.Mesh(new THREE.SphereGeometry(0.106, 12, 8), matBlack);
    hair.position.set(0, 0.64, -0.02);
    hair.scale.set(1, 0.7, 1);
    wg.add(hair);

    // Safety goggles on forehead / eyes
    const goggles = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.05, 0.06), toon(0x38BDF8));

    wg.add(goggles);

    let tablet = null;
    if(hasLaptop){

      wg.add(tablet);
    }

    g.add(wg);
    return { group: wg, legL, legR, armL, armR, head, torso, tablet };
  };

  const seatWorker = (w, worldX, worldZ, rotY) => {
    w.group.position.set(worldX, 0.22, worldZ);
    w.group.rotation.y = rotY;
    w.legL.rotation.x = -Math.PI / 2.1;
    w.legL.position.set(-0.06, 0.21, 0.11);
    w.legR.rotation.x = -Math.PI / 2.1;
    w.legR.position.set(0.06, 0.21, 0.11);

  // Worker A: Standing Hardware Test Engineer inspecting robotic arm at bench
  const testerWorker = makeWorker(acc, false);
  testerWorker.group.position.set(-0.65, 0.12, 0.05);

  // Worker B: Seated QA Lead at brainstorming table
  const qaLeadWorker = makeWorker(0x8B5CF6, false);
  seatWorker(qaLeadWorker, 0.82 - 0.48, 0.45, Math.PI / 2);

  // Worker C: Seated Systems Tester reviewing telemetry and diagnostic logs
  const systemsTester = makeWorker(0x4ADE80, true);
  seatWorker(systemsTester, 0.82 + 0.48, 0.45, -Math.PI / 2);

  // Overhead Testing / Verification Arc & pulse
  const testArch = ringTwin(1.85, 0.035, acc);
  testArch.rotation.x = Math.PI / 2.3;
  testArch.rotation.z = -Math.PI / 4;
  testArch.position.set(0, 0.8, 0);
  g.add(testArch);

  const testPulse = outline(new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 8), toon(0x4ADE80)), 1.2);

  // Floating speech bubbles for brainstorming discussion
  const makeBubble = (col) => {
    const bubG = new THREE.Group();

    bubTail.position.set(-0.04, -0.1, 0);

    bubG.add(bubDot1);
    const bubDot2 = new THREE.Mesh(new THREE.SphereGeometry(0.02, 6, 6), toon(col));
    bubDot2.position.set(0.02, 0, 0.025);
    bubG.add(bubDot2);
    g.add(bubG);
    return bubG;
  };

  const bubbleQA = makeBubble(acc);
  const bubbleSys = makeBubble(0x4ADE80);

  // Waypoints for mobile test rover patrol track
  const roverTrack = [
    new THREE.Vector3(0.0,  0.12, -0.15),
    new THREE.Vector3(-0.15, 0.12, 0.75),
    new THREE.Vector3(0.25,  0.12, 1.2),
    new THREE.Vector3(0.35,  0.12, 0.2)
  ];

  // ── 7. Animation Updates ───────────────────────────────────────────────────
  g.userData.update = (t, dt) => {
    // 1. Update oscilloscope waveform on bench
    for(let i = 0; i < OSCOPE_N; i++){
      const x = -0.13 + (i / (OSCOPE_N - 1)) * 0.26;
      const wave = Math.sin(i * 0.8 - t * 10) * 0.05 + Math.cos(i * 1.6 + t * 5) * 0.025;
      oScopePts[i * 3]     = x;
      oScopePts[i * 3 + 1] = wave;
      oScopePts[i * 3 + 2] = 0;
    }
    oScopeGeo.attributes.position.needsUpdate = true;

    // 2. Robotic arm test probing and kinematic stress cycling
    const armCycle = t * 2.2;
    armSeg1.rotation.z = Math.sin(armCycle) * 0.25;
    armSeg1.rotation.x = Math.cos(armCycle * 0.7) * 0.15;
    armSeg2.rotation.z = -0.3 + Math.cos(armCycle) * 0.35;
    armSeg2.rotation.x = Math.sin(armCycle * 0.5) * 0.2;

    // Pulse test laser
    testBeam.scale.y = 0.8 + Math.sin(t * 14) * 0.35;
    ledPass.scale.setScalar(1 + Math.sin(t * 8) * 0.25);
    ledFail.scale.setScalar(1 + Math.cos(t * 4) * 0.15);

    // 3. Autonomous rover navigation and wheel rotation
    const rovDur = 8.5;
    const rovP = (t % rovDur) / rovDur;
    const rovSeg = Math.floor(rovP * roverTrack.length);
    const rovT = (rovP * roverTrack.length) % 1.0;
    const p0 = roverTrack[rovSeg];
    const p1 = roverTrack[(rovSeg + 1) % roverTrack.length];
    roverG.position.lerpVectors(p0, p1, rovT);

    const rdx = p1.x - p0.x, rdz = p1.z - p0.z;
    const moveAngle = Math.atan2(rdx, rdz);
    roverG.rotation.y = moveAngle;

    // Spin rover wheels & rotate LiDAR turret
    wheels.forEach(w => w.rotation.x = t * 12);
    lidarHead.rotation.y = t * 6;

    // 4. Standing tester engineer inspecting robotic arm
    testerWorker.head.rotation.y = Math.sin(t * 1.8) * 0.18;
    testerWorker.head.rotation.x = -0.15 + Math.sin(t * 2.5) * 0.08;
    testerWorker.armL.rotation.x = -Math.PI / 3.5 + Math.sin(t * 4) * 0.12;
    testerWorker.armR.rotation.x = -Math.PI / 3.5 + Math.sin(t * 3.5 + 1) * 0.12;

    // 5. Brainstorming seated team discussions
    qaLeadWorker.head.rotation.y = Math.sin(t * 2.2) * 0.16;
    qaLeadWorker.head.rotation.x = Math.sin(t * 1.5) * 0.08;
    qaLeadWorker.armL.rotation.x = -Math.PI / 3.2 + Math.sin(t * 3.2) * 0.14;
    qaLeadWorker.armL.rotation.z = 0.12 + Math.sin(t * 2.8) * 0.10;
    qaLeadWorker.armR.rotation.x = -Math.PI / 3.2 + Math.sin(t * 2.5 + 1.0) * 0.12;

    systemsTester.head.rotation.x = -0.12 + Math.sin(t * 2.0) * 0.08;
    systemsTester.head.rotation.y = Math.sin(t * 1.6) * 0.10;
    systemsTester.armL.rotation.x = -Math.PI / 3.2 + Math.sin(t * 12) * 0.04;
    systemsTester.armR.rotation.x = -Math.PI / 3.2 + Math.sin(t * 12 + Math.PI) * 0.04;

    // 6. Speech bubbles for brainstorming discussion
    const talkPhase = t * 1.4;
    const bVis = (Math.sin(talkPhase) > 0.1) ? 1 : 0;
    const cVis = (Math.sin(talkPhase + Math.PI) > 0.1) ? 1 : 0;

    const bPos = qaLeadWorker.group.position;
    bubbleQA.position.set(bPos.x + 0.16, bPos.y + 1.0, bPos.z);
    bubbleQA.scale.setScalar(bVis ? 1 + Math.sin(talkPhase * 3) * 0.06 : 0.001);

    const cPos = systemsTester.group.position;
    bubbleSys.position.set(cPos.x - 0.16, cPos.y + 1.0, cPos.z);
    bubbleSys.scale.setScalar(cVis ? 1 + Math.sin(talkPhase * 3 + Math.PI) * 0.06 : 0.001);

    // 7. Overhead verification arc pulse
    const loopAng = t * 1.8;
    testPulse.position.set(Math.cos(loopAng) * 1.85, 0.8 + Math.sin(loopAng * 2) * 0.25, Math.sin(loopAng) * 0.9);
  };

  return g;
}

    const bubDot1 = new THREE.Mesh(new THREE.SphereGeometry(0.02, 6, 6), toon(col));
    bubDot1.position.set(-0.04, 0, 0.025);
    bubG.add(bubDot1);
    const bubDot2 = new THREE.Mesh(new THREE.SphereGeometry(0.02, 6, 6), toon(col));
    bubDot2.position.set(0.02, 0, 0.025);
    bubG.add(bubDot2);
    g.add(bubG);
    return bubG;
  };

  const bubbleDevOps = makeBubble(acc);
  const bubbleArch   = makeBubble(0x4ADE80);

  // ── 6. Animation Updates ───────────────────────────────────────────────────
  g.userData.update = (t, dt) => {
    // 1. Cloud floating hover & breathing
    cloudG.position.y = 2.2 + Math.sin(t * 1.8) * 0.08;
    cloudG.rotation.y = Math.sin(t * 0.8) * 0.06;
    cloudCore.scale.setScalar(1 + Math.sin(t * 3) * 0.15);

    // 2. Animate Docker container pods ascending into the cloud
    dockerPods.forEach((dp) => {
      const prog = (t * dp.speed + dp.offset) % 1.0;
      const py = 0.28 + prog * 1.95; // ascends from pad up to cloud
      dp.group.position.set(-0.85, py, -0.65);
      dp.group.rotation.y = t * 1.5;

      // Scale in at launch pad, scale down into cloud core
      let sc = 1.0;
      if(prog < 0.15) sc = prog / 0.15;
      else if(prog > 0.85) sc = (1.0 - prog) / 0.15;
      dp.group.scale.setScalar(Math.max(0.001, sc));
    });

    // 3. Launch beam energy pulse
    beamMat.opacity = 0.2 + Math.sin(t * 6) * 0.08;

    // 4. Pipeline screen laser pulse travelling along stages
    const pipeProgress = (t * 0.6) % 1.0;
    const px = THREE.MathUtils.lerp(-0.7, 0.7, pipeProgress);
    pipePulse.position.x = px;
    pipePulse.scale.setScalar(1 + Math.sin(t * 10) * 0.2);

    // Stage nodes subtle status pulse
    stageNodes.forEach((node, i) => {
      const active = Math.abs(px - pipeStages[i].x) < 0.18;
      node.scale.setScalar(active ? 1.08 : 1.0);
    });

    // 5. Standing Release Manager pointing and studying pipeline
    releaseMgr.head.rotation.y = -0.15 + Math.sin(t * 1.6) * 0.12;
    releaseMgr.head.rotation.x = -0.1 + Math.sin(t * 2.2) * 0.06;
    releaseMgr.armR.rotation.x = -Math.PI / 2.3 + Math.sin(t * 3) * 0.1; // active pointing
    releaseMgr.armR.rotation.z = Math.sin(t * 2.5) * 0.08;
    releaseMgr.armL.rotation.x = -0.2 + Math.sin(t * 1.8) * 0.08;

    // 6. Brainstorming seated team discussions
    devOpsEng.head.rotation.y = Math.sin(t * 2.2) * 0.16;
    devOpsEng.head.rotation.x = Math.sin(t * 1.5) * 0.08;
    devOpsEng.armL.rotation.x = -Math.PI / 3.2 + Math.sin(t * 3.2) * 0.14;
    devOpsEng.armL.rotation.z = 0.12 + Math.sin(t * 2.8) * 0.10;
    devOpsEng.armR.rotation.x = -Math.PI / 3.2 + Math.sin(t * 2.5 + 1.0) * 0.12;

    cloudArch.head.rotation.x = -0.12 + Math.sin(t * 2.0) * 0.08;
    cloudArch.head.rotation.y = Math.sin(t * 1.6) * 0.10;
    cloudArch.armL.rotation.x = -Math.PI / 3.2 + Math.sin(t * 12) * 0.04;
    cloudArch.armR.rotation.x = -Math.PI / 3.2 + Math.sin(t * 12 + Math.PI) * 0.04;

    // 7. Speech bubbles for team discussions
    const talkPhase = t * 1.4;
    const bVis = (Math.sin(talkPhase) > 0.1) ? 1 : 0;
    const cVis = (Math.sin(talkPhase + Math.PI) > 0.1) ? 1 : 0;

    const bPos = devOpsEng.group.position;
    bubbleDevOps.position.set(bPos.x + 0.16, bPos.y + 1.0, bPos.z);
    bubbleDevOps.scale.setScalar(bVis ? 1 + Math.sin(talkPhase * 3) * 0.06 : 0.001);

    const cPos = cloudArch.group.position;
    bubbleArch.position.set(cPos.x - 0.16, cPos.y + 1.0, cPos.z);
    bubbleArch.scale.setScalar(cVis ? 1 + Math.sin(talkPhase * 3 + Math.PI) * 0.06 : 0.001);

    // 8. Overhead deployment orbit pulse
    const loopAng = t * 1.8;
    depPulse.position.set(Math.cos(loopAng) * 1.85, 0.8 + Math.sin(loopAng * 2) * 0.25, Math.sin(loopAng) * 0.9);
  };

  return g;
}

    });

  const walkingWorker = makeWorker(0x8B5CF6, true);

      const noise = Math.sin(phase * 3) * 0.02;
      waveScreenPts[i * 3]     = x;
      waveScreenPts[i * 3 + 1] = heartbeat + noise;
      waveScreenPts[i * 3 + 2] = 0;

    // 4. Seated engineer active typing & screen checking
    const nod = Math.sin(t * 3.5) * 0.08;
    seatedWorker.head.rotation.y = nod;
    seatedWorker.armL.rotation.x = -Math.PI / 3 + Math.sin(t * 14) * 0.06;
    seatedWorker.armR.rotation.x = -Math.PI / 3 + Math.sin(t * 14 + Math.PI) * 0.06;

    // 5. Tech Lead looking at big screen & nodding
    leadWorker.head.rotation.y = Math.sin(t * 2.0) * 0.15;
    leadWorker.head.rotation.x = -0.15 + Math.sin(t * 1.5) * 0.05;

    // 6. Walking worker patrol navigation
    const walkDuration = 8.0;
    const progress = (t % walkDuration) / walkDuration;
    const totalSegs = waypoints.length;
    const currentSeg = Math.floor(progress * totalSegs);
    const segT = (progress * totalSegs) % 1.0;
    const p0 = waypoints[currentSeg];
    const p1 = waypoints[(currentSeg + 1) % totalSegs];

    walkingWorker.group.position.lerpVectors(p0, p1, segT);

    // Orient walking worker along movement direction
    const dx = p1.x - p0.x, dz = p1.z - p0.z;
    const moveAngle = Math.atan2(dx, dz);
    walkingWorker.group.rotation.y = moveAngle;

    // Walking leg/arm swing and bob
    const walkCadence = t * 12;
    walkingWorker.legL.rotation.x = Math.sin(walkCadence) * 0.45;
    walkingWorker.legR.rotation.x = -Math.sin(walkCadence) * 0.45;
    walkingWorker.armL.rotation.x = -Math.sin(walkCadence) * 0.35;
    walkingWorker.armR.rotation.x = Math.sin(walkCadence) * 0.35;
    walkingWorker.torso.position.y = 0.38 + Math.abs(Math.sin(walkCadence * 2)) * 0.03;

    // 7. Overhead lifecycle pulse
    const loopAng = t * 1.8;
    loopPulse.position.set(Math.cos(loopAng) * 1.85, 0.8 + Math.sin(loopAng * 2) * 0.25, Math.sin(loopAng) * 0.9);
  };

  return g;
}

});
document.fonts.ready.then(()=>{
  stations.forEach((s,i)=>{ s.sprite.material.map = makeLabelTexture(PHASES[i].num, PHASES[i].name, PHASES[i].hex); });
});

/* ============================================================
   TICKER
============================================================ */
{
  const seg = PHASES.map(p=>
    `<span class="ti"><i style="background:${p.hex}"></i>${p.num} — ${p.name.toUpperCase()}</span><span class="star">★</span>`
  ).join('') + `<span class="ti">OPEN-AIR MONUMENTS PARK · SDLC RESEARCH SANCTUARY</span><span class="star">★</span>`;
  document.getElementById('tickerInner').innerHTML = `<div class="half">${seg}</div><div class="half">${seg}</div>`;
}

/* ============================================================
   NAVIGATION & CHOREOGRAPHY
============================================================ */
const $ = id => document.getElementById(id);
const root = document.documentElement;
const panel = $('panel'), ghost = $('ghost'), rail = $('rail'),
      progFill = $('progFill'), toastEl = $('toast'),
      ovBtn = $('ovBtn'), ovLabel = $('ovLabel');

let active = -1, overview = false, flight = null, flightDone = null;
let lastInteract = performance.now(), lastWheelNav = 0, swapT = null, toastT = null;

const railEls = PHASES.map((p,i)=>{
  const b = document.createElement('button');
  b.className = 'rail-item';
  b.style.setProperty('--item-acc', p.hex);
  b.innerHTML = `<span class="sq"></span><span>${p.num}</span><span>${p.rail}</span>`;
  b.addEventListener('click', ()=>{ lastInteract = performance.now(); goPhase(i); });
  b.addEventListener('pointerenter', ()=>{
    stations[i].targetLight = 40;
    stations[i].pulseT = 0;
    stations[i].pop = clock.elapsedTime;
    stations[i].sprite.material.opacity = 1.0;
    emblem.ticks[i].material.color.set(p.hex);
    emblem.ticks[i].material.opacity = 1;
  });
  b.addEventListener('pointerleave', ()=>{
    if(i !== active){
      stations[i].targetLight = 10;
      stations[i].sprite.material.opacity = 0.55;
      emblem.ticks[i].material.color.set(0x141414);
      emblem.ticks[i].material.opacity = 0.35;
    }
  });
  rail.appendChild(b); return b;
});


function camFor(i){
  const a = i/7*Math.PI*2 - Math.PI/2 + 0.42;
  const sp = stations[i].group.position;
  const aspect = Math.max(0.35, camera.aspect || (innerWidth / innerHeight));
  // Responsive distance scaling: when aspect < 1.05 (portrait / narrow screens), scale camera distance so entire monument & surrounding visitors fit comfortably in view
  const dMult = aspect < 1.05 ? Math.min(1.65, 1.05 / aspect) : 1.0;
  const rad = R + 9 * dMult;
  const camY = 4.1 + 1.5 * dMult;
  return {
    pos: new THREE.Vector3(Math.cos(a)*rad, camY, Math.sin(a)*rad),
    tgt: new THREE.Vector3(sp.x, 4.1, sp.z)
  };
}
function flyTo(pos, tgt, dur=1.5, arc=1.6, done){
  flight = { p0:camera.position.clone(), p1:pos.clone(), t0:controls.target.clone(), t1:tgt.clone(),
             s:performance.now(), d:dur*1000, arc };
  flightDone = done || null;
  controls.enabled = false;
}
function panelSwap(P){
  panel.classList.add('swap');
  clearTimeout(swapT);
  swapT = setTimeout(()=>{
    $('pChip').textContent = P.num;
    if($('pMobileTitle')) $('pMobileTitle').textContent = P.name.toUpperCase();
    $('pKicker').textContent = P.kicker;
    $('pName').textContent = P.name;
    $('pBody').textContent = P.body;
    $('pArtifact').textContent = P.artifact;
    $('pOutputs').textContent = P.outputs;
    $('pWatch').textContent = P.watch;
    panel.classList.remove('swap');
  }, 240);
}
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(()=>toastEl.classList.remove('show'), 3200);
}

function goPhase(i, doFly=true){
  const idx = ((i%7)+7)%7;
  const wrapped = active>=0 && ((active===6&&idx===0)||(active===0&&idx===6));
  const prev = active; active = idx;
  const P = PHASES[idx];

  root.style.setProperty('--acc', P.hex);
  ghost.textContent = P.num;
  railEls.forEach((el,k)=>el.classList.toggle('active', k===idx));
  progFill.style.width = ((idx+1)/7*100)+'%';
  if(innerWidth <= 820) setMobilePanelState(false);
  panelSwap(P);

  stations.forEach((s,k)=>{
    const on = k===idx;
    s.targetLight = on ? 45 : 10;
    if(on){ s.pop = clock.elapsedTime; if(prev!==idx) s.pulseT = 0; }
  });
  emblem.heartMat.color.set(P.hex);
  emblem.r3Mat.color.set(P.hex);
  emblem.ticks.forEach((tk,k)=>{
    tk.material.color.set(k===idx ? P.hex : 0x141414);
    tk.material.opacity = k===idx ? 1 : 0.35;
  });
  if(wrapped) toast('THE LOOP CLOSES — MAINTENANCE SEEDS THE NEXT PLAN');
  if(doFly){ const c = camFor(idx); flyTo(c.pos, c.tgt, 1.5, 1.6); }
}

function setOverview(on){
  if(on === overview) return;
  overview = on;
  document.body.classList.toggle('ov', on);
  ovLabel.textContent = on ? 'RETURN TO MONUMENT' : 'VIEW THE SANCTUARY';
  if(on){
    controls.maxDistance = 140;
    const aspect = Math.max(0.35, camera.aspect || (innerWidth / innerHeight));
    const d = aspect < 1.05 ? Math.min(1.8, 1.05 / aspect) : 1.0;
    flyTo(new THREE.Vector3(0, 30*d, 38*d), new THREE.Vector3(0, 1, 0), 1.9, 0);
    toast('SEVEN MONUMENTS · OPEN-AIR NATURE SANCTUARY — EXPLORE THE VALLEY');
  } else {
    controls.maxDistance = 30;
    goPhase(active);
  }
}

const nav = d => { if(overview){ setOverview(false); return; } goPhase(active+d); };
 $('nextBtn').addEventListener('click', ()=>{ lastInteract = performance.now(); nav(1); });
 $('prevBtn').addEventListener('click', ()=>{ lastInteract = performance.now(); nav(-1); });
ovBtn.addEventListener('click', ()=>{ lastInteract = performance.now(); setOverview(!overview); });

addEventListener('wheel', e=>{
  lastInteract = performance.now();
  if(overview || flight) return;
  const n = performance.now();
  if(n - lastWheelNav < 850) return;
  if(e.deltaY > 24){ lastWheelNav = n; goPhase(active+1); }
  else if(e.deltaY < -24){ lastWheelNav = n; goPhase(active-1); }
}, { passive:true });

addEventListener('keydown', e=>{
  lastInteract = performance.now();
  if(e.key==='ArrowRight'||e.key==='ArrowDown') nav(1);
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp') nav(-1);
  else if(e.key.toLowerCase()==='o') setOverview(!overview);
  else if(e.key==='Escape' && overview) setOverview(false);
  else if(/^[1-7]$/.test(e.key)) goPhase(+e.key-1);
});
// Mobile-only card expand/collapse toggle
const pToggleBadge = $('pToggleBadge');
function setMobilePanelState(open){
  if(innerWidth > 820) return;
  const isExp = panel.classList.toggle('expanded', open);
  document.body.classList.toggle('panel-open', isExp);
  const tbLabel = pToggleBadge ? pToggleBadge.querySelector('.tb-label') : null;
  const tbIcon = pToggleBadge ? pToggleBadge.querySelector('.tb-icon') : null;
  if(tbLabel) tbLabel.textContent = isExp ? 'CLOSE' : 'DETAILS';
  if(tbIcon) tbIcon.textContent = isExp ? '▼' : '▲';
}

panel.addEventListener('click', (e)=>{
  if(innerWidth > 820) return;
  setMobilePanelState(!panel.classList.contains('expanded'));
});

canvas.addEventListener('pointerdown', ()=>{
  lastInteract = performance.now();
  // Collapses open card on mobile when interacting with 3D scene
  if(innerWidth <= 820 && panel.classList.contains('expanded')){
    setMobilePanelState(false);
  }
});

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if(innerWidth > 820){
    panel.classList.remove('expanded');
    document.body.classList.remove('panel-open');
  }
  if(!flight && active >= 0){
    if(overview){
      const aspect = Math.max(0.35, camera.aspect);
      const d = aspect < 1.05 ? Math.min(1.8, 1.05 / aspect) : 1.0;
      camera.position.set(0, 30*d, 38*d);
      controls.target.set(0, 1, 0);
    } else {
      const c = camFor(active);
      camera.position.copy(c.pos);
      controls.target.copy(c.tgt);
    }
    controls.update();
  }
});

// Strictly prevent elastic window bouncing or accidental horizontal swipe gestures on touch devices
addEventListener('touchmove', (e)=>{
  if(!e.target || !e.target.closest || !e.target.closest('#panel.expanded')){
    e.preventDefault();
  }
}, { passive:false });

/* ============================================================
   MAIN LOOP
============================================================ */
const clock = new THREE.Clock();

function animate(){
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

  stations.forEach((s,i)=>{
    if(s.art.userData.update) s.art.userData.update(t, dt);
    s.objG.rotation.y = t*TURNS[i];
    const pk = THREE.MathUtils.clamp((t - s.pop)/0.9, 0, 1);
    s.objG.scale.setScalar(0.8 + 0.2*easeOutBack(pk));
    s.objG.position.y = 2.44 + (i===active ? 0.1 + Math.sin(t*2.1)*0.07 : 0); // active specimen hovers
    s.light.intensity += (s.targetLight - s.light.intensity)*Math.min(1, dt*2.5);
    s.sprite.material.opacity += ((i===active?1:0.55) - s.sprite.material.opacity)*Math.min(1, dt*2.5);
    if(s.pulseT>=0){
      s.pulseT += dt;
      const k = s.pulseT/0.9;
      if(k>=1){ s.pulse.material.opacity = 0; s.pulseT = -1; }
      else { s.pulse.scale.setScalar(0.6 + k*3.2); s.pulse.material.opacity = 0.8*(1-k)*(1-k); }
    }
  });

  emblem.g.userData.update(t);
  confetti.update(t, dt);
  valleyPark.update(t, dt);

  const fogN = overview ? 85 : 32, fogF = overview ? 260 : 115;
  scene.fog.near += (fogN - scene.fog.near)*Math.min(1, dt*2);
  scene.fog.far  += (fogF - scene.fog.far)*Math.min(1, dt*2);

  if(flight){
    const k = Math.min(1, (performance.now()-flight.s)/flight.d);
    const e = easeInOut(k);
    camera.position.lerpVectors(flight.p0, flight.p1, e);
    camera.position.y += Math.sin(e*Math.PI)*flight.arc;
    controls.target.lerpVectors(flight.t0, flight.t1, e);
    camera.lookAt(controls.target);
    if(k>=1){
      flight = null; controls.enabled = true;
      if(flightDone){ const f = flightDone; flightDone = null; f(); }
    }
  } else {
    controls.autoRotate = (!overview && performance.now()-lastInteract > 6000);
    controls.autoRotateSpeed = 0.5;
    controls.update();
  }

  renderer.render(scene, camera);
}
renderer.setAnimationLoop(animate);

/* ============================================================
   INTRO
============================================================ */
goPhase(0, false);
setTimeout(()=>{
  document.getElementById('loader').classList.add('done');
  const c = camFor(0);
  flyTo(c.pos, c.tgt, 2.4, 2.6, ()=>document.body.classList.add('ready'));
}, 900);
</script>
